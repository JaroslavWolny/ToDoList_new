<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Variable fonts: one woff2 per family covers every weight the app uses -->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400..900&family=Plus+Jakarta+Sans:wght@400..800&display=swap" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#5c7cfa" />
  <meta name="description"
    content="QuestDo - Gamified to-do app with XP, streaks, levels, and achievements. Turn your tasks into an RPG adventure." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>QuestDo | Gamified Tasks</title>
</head>

<body>
  <div id="root"></div>
  <script>
    window.addEventListener('error', (e) => {
      if (e.target && e.target.tagName === 'SCRIPT') {
        if (navigator.serviceWorker) {
          navigator.serviceWorker.getRegistrations().then((registrations) => {
            for (let registration of registrations) {
              registration.unregister();
            }
            window.location.reload();
          });
        } else {
          window.location.reload();
        }
      }
    }, true);
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
